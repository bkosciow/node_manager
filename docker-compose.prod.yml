services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "${APP_PORT:-9092}:9092"
      - "${NODE_LISTENER_PORT:-5053}:5053/udp"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - APP_HOST=0.0.0.0
      - APP_PORT=9092
      - API_TOKEN=${API_TOKEN:-}
      - APPRISE_URL=${APPRISE_URL:-}
      - APPRISE_TAG=${APPRISE_TAG:-}
      - PUID=${PUID:-1000}
      - GUID=${GUID:-1000}
      - NODE_NAME=${NODE_NAME:-node_manager}
      - NODE_ID=${NODE_ID:-node_manager_1}
      - NODE_LISTENER_PORT=5053
      - SL_STATISIV=${SL_STATISIV:-}
      - SL_IVKEY=${SL_IVKEY:-}
      - SL_DATAKEY=${SL_DATAKEY:-}
      - SL_PASSPHRASE=${SL_PASSPHRASE:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-node_manager}
      MYSQL_USER: ${MYSQL_USER:-node_manager}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-postgres}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
