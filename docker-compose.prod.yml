name: node_manager_prod

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    network_mode: host
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - APP_HOST=0.0.0.0
      - APP_PORT=9092
      - API_TOKEN=${API_TOKEN:-}
      - APPRISE_URL=${APPRISE_URL:-}
      - APPRISE_TAG=${APPRISE_TAG:-}
      - PUID=${PUID:-1000}
      - GUID=${GUID:-1000}
      - NODE_NAME=${NODE_NAME:-node_manager}
      - NODE_ID=${NODE_ID:-node_manager_1}
      - NODE_LISTENER_PORT=5053
      - SL_STATISIV=${SL_STATISIV:-}
      - SL_IVKEY=${SL_IVKEY:-}
      - SL_DATAKEY=${SL_DATAKEY:-}
      - SL_PASSPHRASE=${SL_PASSPHRASE:-}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9092/health"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

  scanner:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    network_mode: host
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - APP_HOST=0.0.0.0
      - APP_PORT=9092
      - API_TOKEN=${API_TOKEN:-}
      - APPRISE_URL=${APPRISE_URL:-}
      - APPRISE_TAG=${APPRISE_TAG:-}
      - PUID=${PUID:-1000}
      - GUID=${GUID:-1000}
      - NODE_NAME=${NODE_NAME:-node_manager}
      - NODE_ID=${NODE_ID:-node_manager_1}
      - NODE_LISTENER_PORT=5053
      - SL_STATISIV=${SL_STATISIV:-}
      - SL_IVKEY=${SL_IVKEY:-}
      - SL_DATAKEY=${SL_DATAKEY:-}
      - SL_PASSPHRASE=${SL_PASSPHRASE:-}
    command: ["python", "device_scaner.py"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
