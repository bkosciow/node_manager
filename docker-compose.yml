services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    network_mode: host
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - APP_HOST=0.0.0.0
      - APP_PORT=9092
      - API_TOKEN=${API_TOKEN:-}
      - APPRISE_URL=${APPRISE_URL:-}
      - APPRISE_TAG=${APPRISE_TAG:-}
      - PUID=${PUID:-1000}
      - GUID=${GUID:-1000}
      - NODE_NAME=${NODE_NAME:-node_manager}
      - NODE_ID=${NODE_ID:-node_manager_1}
      - NODE_LISTENER_PORT=5053
      - SL_STATISIV=${SL_STATISIV:-}
      - SL_IVKEY=${SL_IVKEY:-}
      - SL_DATAKEY=${SL_DATAKEY:-}
      - SL_PASSPHRASE=${SL_PASSPHRASE:-}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9092/health"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

  scanner:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    network_mode: host
#    ports:
#      - "${NODE_LISTENER_PORT:-5053}:5053/udp"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - APP_HOST=0.0.0.0
      - APP_PORT=9092
      - API_TOKEN=${API_TOKEN:-}
      - APPRISE_URL=${APPRISE_URL:-}
      - APPRISE_TAG=${APPRISE_TAG:-}
      - PUID=${PUID:-1000}
      - GUID=${GUID:-1000}
      - NODE_NAME=${NODE_NAME:-node_manager}
      - NODE_ID=${NODE_ID:-node_manager_1}
      - NODE_LISTENER_PORT=5053
      - SL_STATISIV=${SL_STATISIV:-}
      - SL_IVKEY=${SL_IVKEY:-}
      - SL_DATAKEY=${SL_DATAKEY:-}
      - SL_PASSPHRASE=${SL_PASSPHRASE:-}
    command: ["python", "device_scaner.py"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  db:
    image: mysql:8
    container_name: node_manager_db
    environment:
      MYSQL_ROOT_PASSWORD: postgres
      MYSQL_DATABASE: node_manager_dev
      MYSQL_USER: node_manager
      MYSQL_PASSWORD: postgres
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-uroot", "-ppostgres", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  db_data:
